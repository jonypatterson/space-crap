<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEARSAT — Nearest Satellite Overhead</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #060606;
      --panel: #0a0a0a;
      --amber: #ffb000;
      --cyan: #00e5ff;
      --green: #00ff88;
      --led-white: #e8e8e8;
      --dim: #7a7a7a;
      --dot-size: 4px;
    }

    body {
      font-family: 'VT323', monospace;
      background: var(--bg);
      color: var(--led-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ---- Orbital rings (background decoration) ---- */
    .orbital {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(255,176,0,0.04);
      pointer-events: none;
      z-index: 0;
    }
    .orbital-1 {
      width: 700px; height: 700px;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: spin 30s linear infinite;
    }
    .orbital-1::after {
      content: '';
      position: absolute;
      top: -3px; left: 50%;
      width: 6px; height: 6px;
      background: var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--amber), 0 0 20px rgba(255,176,0,0.3);
    }
    .orbital-2 {
      width: 480px; height: 480px;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      border-color: rgba(0,229,255,0.03);
      animation: spin 22s linear infinite reverse;
    }
    .orbital-2::after {
      content: '';
      position: absolute;
      top: -3px; left: 50%;
      width: 5px; height: 5px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
    }
    @keyframes spin {
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }

    /* ---- Dot-matrix display panel ---- */
    .display {
      position: relative;
      z-index: 1;
      background: var(--panel);
      max-width: 620px;
      width: 100%;
      border-radius: 3px;
      /* Metallic bezel like the physical board */
      border: 3px solid #3a3a3a;
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.6),
        0 8px 40px rgba(0,0,0,0.9),
        0 0 0 1px #1a1a1a;
      overflow: hidden;
    }

    /* The dot matrix LED grid overlay — this is the key effect.
       Creates a mask of tiny circular holes on a dark layer,
       so all content underneath appears as individual lit dots. */
    .display::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle, transparent 1px, rgba(5,5,5,0.35) 1.2px);
      background-size: var(--dot-size) var(--dot-size);
      pointer-events: none;
      z-index: 50;
    }

    .display-inner {
      padding: 28px 32px;
      /* Faint dot grid on the background — the "off" LEDs */
      background-image: radial-gradient(circle, #111 0.6px, transparent 0.6px);
      background-size: var(--dot-size) var(--dot-size);
    }

    /* ---- Header ---- */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      color: var(--amber);
      text-shadow:
        0 0 8px rgba(255,176,0,0.6),
        0 0 20px rgba(255,176,0,0.25);
      letter-spacing: 6px;
    }
    .tagline {
      margin-top: 8px;
      font-size: 18px;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ---- Divider ---- */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      opacity: 0.25;
      margin: 14px 0;
    }

    /* ---- Status / loading ---- */
    #status {
      text-align: center;
      padding: 24px 0;
      font-size: 22px;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0,229,255,0.5);
      position: relative;
    }
    #status.error {
      color: #ff4444;
      text-shadow: 0 0 8px rgba(255,68,68,0.5);
    }

    /* Scanning line animation */
    .scan-line {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ---- Result ---- */
    #result {
      display: none;
    }
    #result.visible {
      display: block;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .sat-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: var(--green);
      text-shadow:
        0 0 8px rgba(0,255,136,0.6),
        0 0 18px rgba(0,255,136,0.25);
      text-align: center;
      margin: 16px 0 4px;
      line-height: 1.7;
      word-break: break-all;
    }

    /* Type badge */
    .type-badge {
      text-align: center;
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .type-payload  { color: #00ff9d; }
    .type-rocket   { color: #f0a500; }
    .type-debris   { color: #ff4444; }
    .type-unknown  { color: #666; }

    /* Decay warning */
    .decay-warning {
      text-align: center;
      color: var(--amber);
      font-size: 18px;
      letter-spacing: 1px;
      margin: 8px 0;
      text-shadow: 0 0 6px rgba(255,176,0,0.4);
    }

    /* Section divider (subtle) */
    .section-divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin: 10px 0;
      grid-column: 1 / -1;
    }

    /* Data readout grid */
    .data-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 20px;
      margin: 14px 0;
    }
    .data-label {
      font-size: 20px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .data-value {
      font-size: 24px;
      color: var(--led-white);
      text-shadow: 0 0 6px rgba(255,255,255,0.35);
      text-align: right;
    }

    /* Color-coded altitude */
    .alt-vlow  { color: var(--green); text-shadow: 0 0 6px rgba(0,255,136,0.35); }
    .alt-leo   { color: var(--led-white); }
    .alt-meo   { color: var(--amber); text-shadow: 0 0 6px rgba(255,176,0,0.35); }
    .alt-geo   { color: var(--cyan); text-shadow: 0 0 6px rgba(0,229,255,0.35); }

    /* Pulsing status dot */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .status-active::before {
      content: '● ';
      color: #00ff9d;
      animation: pulse 2s infinite;
    }
    .status-inactive::before {
      content: '● ';
      color: #666;
    }

    /* Pixel flags */
    .pflag {
      display: inline-block;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0;
      vertical-align: middle;
      margin-right: 6px;
      font-family: monospace;
      text-shadow: none;
    }
    .pflag span { font-size: 10px; }

    /* Stale data warning */
    .data-stale {
      color: var(--amber) !important;
      text-shadow: 0 0 6px rgba(255,176,0,0.35) !important;
    }

    /* CRT scanline overlay */
    .display::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 51;
      border-radius: inherit;
    }

    /* Track link */
    .track-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: var(--cyan);
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(0,229,255,0.3);
      transition: text-shadow 0.2s;
    }
    .track-link:hover {
      text-shadow: 0 0 12px rgba(0,229,255,0.6);
    }

    /* Button */
    .btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--amber);
      color: var(--amber);
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      position: relative;
      z-index: 60; /* above the dot overlay */
    }
    .btn:hover {
      background: rgba(255,176,0,0.08);
      box-shadow: 0 0 14px rgba(255,176,0,0.2);
    }
    .btn:active {
      background: rgba(255,176,0,0.15);
    }
    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Last checked timestamp */
    .last-checked {
      text-align: center;
      color: var(--dim);
      font-size: 16px;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* ---- Footer ---- */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      text-align: center;
      color: #2a2a2a;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .footer a {
      color: #3a3a3a;
      text-decoration: none;
    }
    .footer a:hover { color: var(--dim); }

    /* ---- Responsive ---- */
    @media (max-width: 500px) {
      .display-inner { padding: 20px 16px; }
      .header h1 { font-size: 16px; letter-spacing: 3px; }
      .tagline { font-size: 14px; }
      .sat-name { font-size: 11px; }
      .data-label { font-size: 15px; }
      .data-value { font-size: 18px; }
      .btn { font-size: 8px; padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="orbital orbital-1"></div>
  <div class="orbital orbital-2"></div>

  <div class="display">
    <div class="display-inner">

      <div class="header">
        <h1>NEARSAT</h1>
        <div class="tagline">nearest satellite overhead</div>
      </div>

      <div class="divider"></div>

      <div id="status">
        ACQUIRING LOCATION<span class="cursor">_</span>
        <div class="scan-line"></div>
      </div>

      <div id="result">
        <div class="sat-name" id="sat-name"></div>
        <div class="type-badge" id="type-badge"></div>

        <div class="decay-warning" id="decay-warning" style="display:none"></div>

        <div class="divider"></div>

        <div class="data-grid">
          <!-- Identity -->
          <span class="data-label">NORAD ID</span>
          <span class="data-value" id="sat-id">&mdash;</span>

          <span class="data-label">DESIGNATOR</span>
          <span class="data-value" id="sat-intl">&mdash;</span>

          <span class="data-label">COUNTRY</span>
          <span class="data-value" id="sat-country">&mdash;</span>

          <span class="data-label">MISSION</span>
          <span class="data-value" id="sat-mission">&mdash;</span>

          <hr class="section-divider">

          <!-- Position -->
          <span class="data-label">ALTITUDE</span>
          <span class="data-value" id="sat-alt">&mdash;</span>

          <span class="data-label">POSITION</span>
          <span class="data-value" id="sat-pos">&mdash;</span>

          <span class="data-label">ANGULAR DIST</span>
          <span class="data-value" id="sat-angle">&mdash;</span>

          <hr class="section-divider">

          <!-- Orbital mechanics -->
          <span class="data-label">SPEED</span>
          <span class="data-value" id="sat-speed">&mdash;</span>

          <span class="data-label">ORBITAL PERIOD</span>
          <span class="data-value" id="sat-period">&mdash;</span>

          <span class="data-label">INCLINATION</span>
          <span class="data-value" id="sat-incl">&mdash;</span>

          <span class="data-label">ECCENTRICITY</span>
          <span class="data-value" id="sat-ecc">&mdash;</span>

          <span class="data-label">TOTAL ORBITS</span>
          <span class="data-value" id="sat-orbits">&mdash;</span>

          <hr class="section-divider">

          <!-- Classification -->
          <span class="data-label">LAUNCHED</span>
          <span class="data-value" id="sat-launch">&mdash;</span>

          <span class="data-label">SIZE</span>
          <span class="data-value" id="sat-size">&mdash;</span>

          <span class="data-label">STATUS</span>
          <span class="data-value" id="sat-status">&mdash;</span>

          <span class="data-label">DATA AGE</span>
          <span class="data-value" id="sat-age">&mdash;</span>
        </div>

        <a class="track-link" id="track-link" href="#" target="_blank" rel="noopener">
          ▸ TRACK ON N2YO
        </a>

        <button class="btn" id="refresh-btn">&#9670; CHECK AGAIN</button>

        <div class="last-checked" id="last-checked"></div>
      </div>

    </div>
  </div>

  <div class="footer">
    DATA VIA <a href="https://celestrak.org" target="_blank" rel="noopener">CELESTRAK.ORG</a>
  </div>

  <script>
    (function () {
      // DOM
      const statusEl      = document.getElementById('status');
      const resultEl      = document.getElementById('result');
      const satNameEl     = document.getElementById('sat-name');
      const typeBadgeEl   = document.getElementById('type-badge');
      const decayWarnEl   = document.getElementById('decay-warning');
      const satIdEl       = document.getElementById('sat-id');
      const satIntlEl     = document.getElementById('sat-intl');
      const satCountryEl  = document.getElementById('sat-country');
      const satAltEl      = document.getElementById('sat-alt');
      const satPosEl      = document.getElementById('sat-pos');
      const satAngleEl    = document.getElementById('sat-angle');
      const satSpeedEl    = document.getElementById('sat-speed');
      const satPeriodEl   = document.getElementById('sat-period');
      const satInclEl     = document.getElementById('sat-incl');
      const satEccEl      = document.getElementById('sat-ecc');
      const satOrbitsEl   = document.getElementById('sat-orbits');
      const satLaunchEl   = document.getElementById('sat-launch');
      const satSizeEl     = document.getElementById('sat-size');
      const satStatusEl   = document.getElementById('sat-status');
      const satAgeEl      = document.getElementById('sat-age');
      const satMissionEl  = document.getElementById('sat-mission');
      const trackLinkEl   = document.getElementById('track-link');
      const refreshBtn    = document.getElementById('refresh-btn');
      const lastChecked   = document.getElementById('last-checked');

      let loading = false;

      // Helpers
      function showStatus(msg, isError) {
        statusEl.style.display = 'block';
        statusEl.className = isError ? 'error' : '';
        statusEl.innerHTML = isError
          ? msg
          : msg + '<span class="cursor">_</span><div class="scan-line"></div>';
        resultEl.classList.remove('visible');
      }

      function getUserLocation() {
        return new Promise(function (resolve, reject) {
          if (!navigator.geolocation) {
            return reject(new Error('Geolocation is not supported by your browser.'));
          }
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            },
            function (err) {
              var msgs = {
                1: 'Location access denied. Please enable location in your browser settings.',
                2: 'Location unavailable. Please try again.',
                3: 'Location request timed out. Please try again.'
              };
              reject(new Error(msgs[err.code] || 'Unknown location error.'));
            },
            { enableHighAccuracy: false, timeout: 10000 }
          );
        });
      }

      function fmtCoord(lat, lng) {
        var latD = lat >= 0 ? 'N' : 'S';
        var lngD = lng >= 0 ? 'E' : 'W';
        return Math.abs(lat).toFixed(1) + '°' + latD + '  ' + Math.abs(lng).toFixed(1) + '°' + lngD;
      }

      function decodeStatus(code) {
        var map = {
          '+': 'ACTIVE', '-': 'INACTIVE', 'P': 'PARTIALLY ACTIVE',
          'B': 'BACKUP', 'S': 'SPARE', 'X': 'EXTENDED MISSION',
          'D': 'DECAYING', '?': 'UNKNOWN',
        };
        return map[code] || 'UNKNOWN';
      }

      // Pixel-art flags using block chars (█ ▀ ▄)
      function pixelFlag(code) {
        var B = '█'; // full block
        var flags = {
          'US':  '<span style="color:#3c3b6e">' + B+B+B + '</span><span style="color:#b22234">' + B+B+B + '</span><br>'
               + '<span style="color:#3c3b6e">' + B+B+B + '</span><span style="color:#fff">' + B+B+B + '</span><br>'
               + '<span style="color:#b22234">' + B+B+B+B+B+B + '</span>',
          'CN':  '<span style="color:#de2910">' + B + '</span><span style="color:#ffde00">' + B + '</span><span style="color:#de2910">' + B+B+B+B + '</span><br>'
               + '<span style="color:#de2910">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#de2910">' + B+B+B+B+B+B + '</span>',
          'CIS': '<span style="color:#fff">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#0039a6">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#d52b1e">' + B+B+B+B+B+B + '</span>',
          'FR':  '<span style="color:#002395">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><span style="color:#ed2939">' + B+B + '</span><br>'
               + '<span style="color:#002395">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><span style="color:#ed2939">' + B+B + '</span><br>'
               + '<span style="color:#002395">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><span style="color:#ed2939">' + B+B + '</span>',
          'UK':  '<span style="color:#012169">' + B + '</span><span style="color:#c8102e">' + B + '</span><span style="color:#fff">' + B + '</span><span style="color:#c8102e">' + B + '</span><span style="color:#012169">' + B + '</span><br>'
               + '<span style="color:#fff">' + B + '</span><span style="color:#c8102e">' + B+B+B + '</span><span style="color:#fff">' + B + '</span><br>'
               + '<span style="color:#012169">' + B + '</span><span style="color:#c8102e">' + B + '</span><span style="color:#fff">' + B + '</span><span style="color:#c8102e">' + B + '</span><span style="color:#012169">' + B + '</span>',
          'J':   '<span style="color:#fff">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#fff">' + B+B + '</span><span style="color:#bc002d">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><br>'
               + '<span style="color:#fff">' + B+B+B+B+B+B + '</span>',
          'IN':  '<span style="color:#ff9933">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#fff">' + B+B + '</span><span style="color:#000080">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><br>'
               + '<span style="color:#138808">' + B+B+B+B+B+B + '</span>',
          'DE':  '<span style="color:#000">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#d00">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#fc0">' + B+B+B+B+B+B + '</span>',
          'IT':  '<span style="color:#009246">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><span style="color:#ce2b37">' + B+B + '</span><br>'
               + '<span style="color:#009246">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><span style="color:#ce2b37">' + B+B + '</span><br>'
               + '<span style="color:#009246">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><span style="color:#ce2b37">' + B+B + '</span>',
          'ESA': '<span style="color:#003399">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#003399">' + B+B + '</span><span style="color:#fc0">' + B+B + '</span><span style="color:#003399">' + B+B + '</span><br>'
               + '<span style="color:#003399">' + B+B+B+B+B+B + '</span>',
          'KR':  '<span style="color:#fff">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#fff">' + B + '</span><span style="color:#c60c30">' + B + '</span><span style="color:#003478">' + B + '</span><span style="color:#fff">' + B+B+B + '</span><br>'
               + '<span style="color:#fff">' + B+B+B+B+B+B + '</span>',
          'CA':  '<span style="color:#d52b1e">' + B + '</span><span style="color:#fff">' + B+B+B+B + '</span><span style="color:#d52b1e">' + B + '</span><br>'
               + '<span style="color:#d52b1e">' + B + '</span><span style="color:#fff">' + B + '</span><span style="color:#d52b1e">' + B+B + '</span><span style="color:#fff">' + B + '</span><span style="color:#d52b1e">' + B + '</span><br>'
               + '<span style="color:#d52b1e">' + B + '</span><span style="color:#fff">' + B+B+B+B + '</span><span style="color:#d52b1e">' + B + '</span>',
          'AU':  '<span style="color:#012169">' + B+B+B + '</span><span style="color:#e4002b">' + B + '</span><span style="color:#012169">' + B+B + '</span><br>'
               + '<span style="color:#012169">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#012169">' + B+B+B+B+B+B + '</span>',
          'BR':  '<span style="color:#009c3b">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#009c3b">' + B + '</span><span style="color:#ffdf00">' + B+B+B+B + '</span><span style="color:#009c3b">' + B + '</span><br>'
               + '<span style="color:#009c3b">' + B+B+B+B+B+B + '</span>',
          'IL':  '<span style="color:#0038b8">' + B+B+B+B+B+B + '</span><br>'
               + '<span style="color:#fff">' + B+B + '</span><span style="color:#0038b8">' + B+B + '</span><span style="color:#fff">' + B+B + '</span><br>'
               + '<span style="color:#0038b8">' + B+B+B+B+B+B + '</span>',
        };
        return flags[code] || null;
      }

      function decodeCountry(code) {
        var map = {
          'US': 'UNITED STATES', 'CN': 'CHINA', 'CIS': 'RUSSIA',
          'FR': 'FRANCE', 'ESA': 'ESA', 'UK': 'UNITED KINGDOM',
          'IN': 'INDIA', 'J': 'JAPAN', 'ISS': 'INTL SPACE STATION',
          'AB': 'ARAB LEAGUE',
        };
        return map[code] || code || 'UNKNOWN';
      }

      function typewriterEffect(element, text, speed) {
        speed = speed || 40;
        element.textContent = '';
        var i = 0;
        var timer = setInterval(function () {
          element.textContent += text[i];
          i++;
          if (i >= text.length) clearInterval(timer);
        }, speed);
      }

      function getTypeBadge(type) {
        var glyphs = { 'WORKING SATELLITE': '◈', 'SPENT ROCKET': '◉', 'JUNK': '⚠', 'UNKNOWN': '?' };
        var classes = { 'WORKING SATELLITE': 'type-payload', 'SPENT ROCKET': 'type-rocket', 'JUNK': 'type-debris', 'UNKNOWN': 'type-unknown' };
        var glyph = glyphs[type] || '?';
        var cls = classes[type] || 'type-unknown';
        return '<span class="' + cls + '">' + glyph + ' ' + type + '</span>';
      }

      function getAltClass(alt) {
        if (alt < 600) return 'alt-vlow';
        if (alt <= 2000) return 'alt-leo';
        if (alt <= 35786) return 'alt-meo';
        return 'alt-geo';
      }

      function fmtDataAge(epoch) {
        if (!epoch) return { text: '\u2014', stale: false };
        var diff = (Date.now() - new Date(epoch).getTime()) / 3600000; // hours
        var text = diff.toFixed(1) + ' HRS';
        if (diff > 48) text += ' \u26a0';
        return { text: text, stale: diff > 48 };
      }

      function fmtNumber(n) {
        if (n == null) return '\u2014';
        return n.toLocaleString();
      }

      function renderSatellite(sat) {
        if (!sat) {
          showStatus('NO SATELLITES DETECTED OVERHEAD', true);
          return;
        }

        statusEl.style.display = 'none';
        resultEl.classList.add('visible');

        // Name with typewriter effect
        typewriterEffect(satNameEl, sat.name || 'UNKNOWN');

        // Type badge
        typeBadgeEl.innerHTML = getTypeBadge(sat.objectType || 'UNKNOWN');

        // Decay warning
        if (sat.decayDate) {
          decayWarnEl.textContent = '\u26a0 REENTRY PREDICTED: ' + sat.decayDate;
          decayWarnEl.style.display = 'block';
        } else {
          decayWarnEl.style.display = 'none';
        }

        // Identity
        satIdEl.textContent      = sat.noradId || '\u2014';
        satIntlEl.textContent    = sat.objectId || '\u2014';
        var flag = pixelFlag(sat.country);
        if (flag) {
          satCountryEl.innerHTML = '<span class="pflag">' + flag + '</span> ' + decodeCountry(sat.country);
        } else {
          satCountryEl.textContent = decodeCountry(sat.country);
        }
        satMissionEl.textContent = sat.mission || '\u2014';

        // Position
        satAltEl.textContent = sat.alt != null ? sat.alt.toFixed(1) + ' KM' : '\u2014';
        satAltEl.className   = 'data-value ' + (sat.alt != null ? getAltClass(sat.alt) : '');
        satPosEl.textContent = (sat.lat != null && sat.lng != null)
          ? fmtCoord(sat.lat, sat.lng) : '\u2014';
        satAngleEl.textContent = sat.angularDistance != null
          ? sat.angularDistance.toFixed(1) + '°' : '\u2014';

        // Orbital mechanics
        satSpeedEl.textContent  = sat.speed != null ? sat.speed.toFixed(2) + ' KM/S' : '\u2014';
        satPeriodEl.textContent = sat.orbitalPeriod != null ? sat.orbitalPeriod.toFixed(1) + ' MIN' : '\u2014';
        satInclEl.textContent   = sat.inclination != null ? sat.inclination.toFixed(1) + '°' : '\u2014';
        satEccEl.textContent    = sat.eccentricity != null ? sat.eccentricity.toFixed(4) : '\u2014';
        satOrbitsEl.textContent = fmtNumber(sat.revAtEpoch);

        // Classification
        satLaunchEl.textContent = sat.launchDate || '\u2014';
        satSizeEl.textContent   = sat.size || '\u2014';

        // Status with pulsing dot
        var statusText = decodeStatus(sat.status);
        var statusClass = (sat.status === '+') ? 'status-active' : 'status-inactive';
        satStatusEl.innerHTML = '<span class="' + statusClass + '">' + statusText + '</span>';

        // Data age
        var age = fmtDataAge(sat.epoch);
        satAgeEl.textContent = age.text;
        satAgeEl.className = 'data-value' + (age.stale ? ' data-stale' : '');

        trackLinkEl.href = 'https://www.n2yo.com/satellite/?s=' + sat.noradId;

        var now = new Date();
        lastChecked.textContent = 'LAST CHECK: ' + now.toLocaleTimeString();
      }

      // Main
      async function getNearestSatellite() {
        if (loading) return;
        loading = true;
        refreshBtn.disabled = true;

        showStatus('ACQUIRING LOCATION');

        try {
          var loc = await getUserLocation();
          showStatus('SCANNING ORBITAL OBJECTS');

          var res  = await fetch('/api/satellite?lat=' + loc.lat + '&lng=' + loc.lng);
          var data = await res.json();

          if (res.status === 429) {
            showStatus('RATE LIMIT EXCEEDED — TRY AGAIN SHORTLY', true);
            return;
          }
          if (!res.ok || data.error) {
            showStatus(data.error || 'SIGNAL LOST — PLEASE RETRY', true);
            return;
          }

          renderSatellite(data.nearest);
        } catch (err) {
          showStatus(err.message || 'CONNECTION FAILURE', true);
        } finally {
          loading = false;
          refreshBtn.disabled = false;
        }
      }

      refreshBtn.addEventListener('click', getNearestSatellite);
      getNearestSatellite();
    })();
  </script>

</body>
</html>
